# AI4PCB x KiCadRoutingTools Structured Improvement Registry (SSOT)
# Synced 1-to-1 with docs/AI4PCB_IMPROVEMENT_PLAYBOOK.md
schema_version: 1
updated_at: "2026-11-25"
repository:
  fork_path: "Tools/KiCadRoutingTools"
  branch: "ai4pcb/main"
  upstream_repo: "https://github.com/drandyhaas/KiCadRoutingTools.git"
  upstream_base_commit: "61565f3"
  origin_remote: "https://github.com/chinayuren2022-2025/KiCadRoutingTools.git"

status_enum:
  - VERIFIED           # Implemented, unit-tested, and proven via paired A/B
  - CONDITIONAL        # Implemented & tested; positive only under gated preconditions
  - DIAGNOSED_BACKLOG  # Root-caused with concrete fix spec; queued for implementation
  - PLANNED            # Architectural roadmap item

pipeline_stages:
  - id: S0
    name: "机械边界锁定与路线 B 约束编译"
    input_artifacts: ["board.yaml", "raw.kicad_pcb"]
    output_artifacts: ["fixed.kicad_pcb", "routing_policy.json", "compiled_constraints.json", "judge_chain.txt"]
  - id: S1
    name: "功能拓扑分组与意图契约校验"
    input_artifacts: ["fixed.kicad_pcb", "compiled_constraints.json"]
    output_artifacts: ["groups.json", "intent.json"]
  - id: S2
    name: "宏观流场初值、物理硬约束与有界局部退火"
    input_artifacts: ["fixed.kicad_pcb", "groups.json", "intent.json", "physics_constraints.json"]
    output_artifacts: ["s{0..N-1}.kicad_pcb", "judge.json"]
  - id: S3
    name: "几何多样性筛选与两级并行布线择优"
    input_artifacts: ["s{0..N-1}.kicad_pcb", "judge.json", "judge_chain.txt"]
    output_artifacts: ["s{best}.kicad_pcb", "s{best}_full.kicad_pcb", "s{best}_full.score.json"]
  - id: S4
    name: "确定性布线策略与模拟/高速规则"
    input_artifacts: ["s{best}.kicad_pcb", "routing_policy.json"]
    output_artifacts: ["routed.kicad_pcb", "route.json"]
  - id: S5
    name: "确定性模拟收尾原语与真 DRC/DFM 硬门禁"
    input_artifacts: ["routed.kicad_pcb", "compiled_constraints.json"]
    output_artifacts: ["delivered.kicad_pcb", "delivered.drc.json", "delivered.audit.json"]
  - id: S6
    name: "布线失败/拥堵热力图回灌闭环与 Agent Harness"
    input_artifacts: ["routed.kicad_pcb", "route.json"]
    output_artifacts: ["feedback.json", "feedback_constraints.json", "refined.kicad_pcb"]
  - id: S7
    name: "工程基础设施性能、跨平台稳定性与多板回归"
    input_artifacts: ["KRT runtime", "PCB_Reference_Corpus"]
    output_artifacts: ["benchmark_reports", "ci_regression_results"]

modifications:
  - id: MOD-S0-01
    stage: S0
    name: "路线 B `board.yaml` 确定性约束编译器"
    status: VERIFIED
    priority: P0
    risk: LOW
    code_anchors:
      - file: "py_tools/compile_board_constraints.py"
        symbols: ["compile_constraints", "render_judge_chain", "_infer_symmetry_from_connectors"]
      - file: "py_placer/judge_seeds.py"
        symbols: ["main (--no-diff-pair-warn)"]
    cli_flags:
      - "py_tools/compile_board_constraints.py <board.yaml> <pcb> --out-dir <dir> --same-net-pad-clearance 0.30"
      - "py_placer/judge_seeds.py ... --no-diff-pair-warn"
    baseline_failure: "LLM 手工抄写约束漏掉 /CHASSIS (退化至 0.20 mm) 与下游保护轨 /VCC_DUT /VEE_DUT；KRT 正则误将 /V_GP & /V_GN 判为差分对；unconnected-* 单焊盘网混入布线列表。"
    mechanism: "直接编译 board.yaml + .kicad_pcb，确定性输出加宽电源/机壳网表、安全同网避让、热源/敏感器件集合、锁定连接器推导的 X/Y 平移向量及 forbid_regex_diff_pairs 策略。"
    rollback: "不传 --board-yaml，回退手工编写 chain.txt。"
    evidence:
      experiment_ids: ["EXP-02", "EXP-03"]
      key_deltas:
        - metric: "power_and_chassis_omissions"
          baseline: "3 nets missed/narrowed"
          treatment: "0 missed (/CHASSIS 0.80mm, rails 0.65-0.80mm)"
        - metric: "regex_diff_pair_false_positives"
          baseline: "1 false pair (/V_GP & /V_GN)"
          treatment: "0 (suppressed by policy)"
    boundaries: "要求 board.yaml 遵循 GongLab 路线 B schema；无 board.yaml 的外部板可跳过并手写 chain.txt。"
    regression_tests: ["tests/test_ai4pcb_constraints_and_harness.py"]

