    baseline_failure: "上游退火缺少几何对称与自定义热隔离项；B01 自由布局 41 对 X/Y 通道平均失配 22.89 mm、最大 74.31 mm、朝向错乱 25/41，2512 功率电阻距精密 IC 仅 16.24 mm。"
    mechanism: "在 O(1) 增量代价引擎加入 symmetry 与 apart_min 原语；SA 对称移动算子以 75% 概率同步平移/旋转配对器件、25% 概率允许单件合法化微调。"
    rollback: "省略 --constraints-json 即 100% 退回上游行为。"
    evidence:
      experiment_ids: ["EXP-03"]
      key_deltas:
        - metric: "xy_41pair_mean_error_mm"
          baseline: "22.89 mm (max 74.31 mm)"
          treatment: "0.00 mm (max 0.00 mm across all 6 seeds)"
        - metric: "xy_41pair_rot_mismatches"
          baseline: "25.0 / 41"
          treatment: "0.0 / 41"
        - metric: "min_hot_to_sensitive_ic_mm"
          baseline: "16.24 mm"
          treatment: "24.17 mm (+48.8%)"
        - metric: "min_hot_to_hot_mm"
