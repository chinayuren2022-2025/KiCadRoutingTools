    why_improve: "根除无人值守夜间批量实验与子代理执行时的 600s 假死超时。"
    how_to_test:
      unit_tests: ["6 组单测全量回归"]
      experiments: ["挂死现场复现对照 + Trial 5A（修复前）vs Trial 5B（修复后）端到端布局耗时对比"]
