    stage: S1
    name: "前置契约预校验与原生早检 Courtyard DRC 门禁"
    status: VERIFIED
    priority: P1
    risk: LOW
    code_anchors:
      - file: "py_tools/ai4pcb_harness.py"
        symbols: ["cmd_place", "_early_courtyard_check"]
    cli_flags:
      - "py_tools/ai4pcb_harness.py place <work_dir> --groups <g> --intent <i> [--no-check-courtyard]"
    baseline_failure: "分组漏件或意图格式错在耗时 60s+ 的退火后才暴露；布线后才发现封装 courtyard 碰撞导致整轮返工。"
    mechanism: "退火前强制运行 check_groups.py / check_floorplan.py；退火后对入围种子立即跑不覆铜的 kicad-cli pcb drc (<2s/seed) 筛查 courtyard_overlap。"
    rollback: "--skip-validate / --no-check-courtyard"
    evidence:
      experiment_ids: ["EXP-03"]
      key_deltas:
        - metric: "early_courtyard_check_latency"
          baseline: "discovered after full route + zone refill (~5-10 min)"
          treatment: "<2 s/seed right after placement (0/18 overlaps verified across Exp03)"
    boundaries: "原生早检不执行覆铜，仅负责机械封装与板边冲突前置拦截，不替代 Stage 5 全量 DRC。"
    regression_tests: ["tests/test_ai4pcb_constraints_and_harness.py"]

