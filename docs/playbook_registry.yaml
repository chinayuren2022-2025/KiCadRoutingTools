    cli_flags: []
    baseline_failure: "基于 KiCad python.exe 创建的 venv 实际经由 GUI 子系统 pythonw.exe 运行；其派生的子进程若未设置 CREATE_NO_WINDOW，在 Windows 锁屏/高并发下会为每个子进程创建孤立 conhost.exe，积累至 ~45 个后触发窗口站初始化挂死（0.00 CPU / 2.7 MB RAM）。"
    mechanism: "Windows 环境下所有内部 subprocess 调用显式传入 creationflags=subprocess.CREATE_NO_WINDOW；同时推荐主环境优先使用标准 console Python 3.12（仅 pcbnew 步骤调 KiCad Python）。"
    rollback: "移除 creationflags 参数。"
    evidence:
      experiment_ids: ["Runtime incident 2026-11-25 08:35 (10 stuck conhost processes vs 3s direct console run)"]
      key_deltas:
        - metric: "subprocess_startup_under_headless_windows"
          baseline: "Hung indefinitely at 2.7MB RAM / 0.00 CPU after ~40 conhosts"
          treatment: "3 s deterministic completion, 0 orphan conhost windows"
    boundaries: "仅对 Windows (os.name == 'nt') 生效；Linux/macOS 自动忽略。"
    regression_tests: ["Verified live on Exp03 analog_finish v2"]

symptom_matrix:
  - symptom: "非 EP SMD 焊盘上出现过孔 (via_in_smd > 0) 或焊盘擦边"
    mod_ids: ["MOD-S4-01", "MOD-S5-01"]
    action: "布线加 --same-net-pad-clearance 0.25~0.30；收尾走 analog_finish.py --same-net-smd-clearance 0.25"
  - symptom: "细间距 IC 触发 starved_thermal，改覆铜又会毁掉 0603 热焊盘"
    mod_ids: ["MOD-S5-01"]
    action: "调用 analog_finish.py（外层保持 THERMAL，Pass-2 局部手术刀修复 IC 引脚或给被动件补 0.25mm 短引线+NONE）"
  - symptom: "双通道精密模拟板 X/Y 不对称、功率电阻离运放太近"
    mod_ids: ["MOD-S0-01", "MOD-S2-01"]
    action: "用 compile_board_constraints.py 生成约束并补全 symmetry_pairs，跑 place_simple.py --constraints-json"
  - symptom: "多 Seed 代理代价第 1 名布线反而很差 / 多个 Seed 长得一模一样"
    mod_ids: ["MOD-S3-01"]
    action: "生成 12~18 个候选，使用 --diverse auto --judge 6 + judge_seeds.py --confirm close"
  - symptom: "强物理约束下不同 Seed 代理代价波动极大"
    mod_ids: ["MOD-S2-02"]
    action: "加 --macro-flow 做二次流场温启动（全局摆件勿加过紧 --local-radius）"
  - symptom: "电源轨或 /CHASSIS 被走成细信号线，或 /V_GP & /V_GN 被误报差分对"
    mod_ids: ["MOD-S0-01"]
    action: "用 compile_board_constraints.py 编译 board.yaml，并在 judge_seeds.py 启用 --no-diff-pair-warn"
  - symptom: "全量布线仍存在 blocking > 0 断线，但不想整板重摆"
    mod_ids: ["MOD-S6-01"]
    action: "执行 ai4pcb_harness.py feedback-refine（内置 keep-if-better 防退化门禁）"
  - symptom: "Windows 并行多 Seed 突然极慢或卡在 2.7MB 0% CPU"
    mod_ids: ["MOD-S7-01", "MOD-S7-02"]
    action: "Windows subprocess 启用 CREATE_NO_WINDOW；避免过多并发冷缓存 GLB 导出（P0 待合入 heights.py 0° 缓存）"

