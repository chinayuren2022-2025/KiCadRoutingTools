      summary: "单测 <1e-5 PASS；Exp 03 6-Seed 均值：41 对平移误差 22.89->0.00mm、最大 74.31->0.00mm、朝向错 25->0/41、热阻-IC 16.24->24.17mm (+48.8%)、热阻互距 5.62->11.12mm (+97.9%)、L2 零阻断 0/4->2/4；B1 s2 终审 DRC 0/0、铜长 1190.32mm (-47.4% vs 人绘)。Trial 5A 38 配对 0.000mm、热阻-IC 61.46mm。"
