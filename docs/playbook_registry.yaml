    boundaries: "对称配对表需确保两侧子电路封装相同且板内有对应平移/镜像空间；过高权重会略升代理代价但不影响 0-blocking 可布通性。"
    regression_tests: ["tests/test_ai4pcb_physics_and_feedback.py"]

